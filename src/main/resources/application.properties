spring.application.name=RackView

# Base de dados H2 em memória
spring.datasource.url=jdbc:h2:mem:rackviewdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# API
server.port=8080

# Configuração de infraestrutura do RackView
rackview.data-centers[0].nome=SE03
rackview.data-centers[0].bastidores[0].nome=B-1A
rackview.data-centers[0].bastidores[0].nickname=ODF-Master
rackview.data-centers[0].bastidores[1].nome=B-1B
rackview.data-centers[0].bastidores[2].nome=B-1C
rackview.data-centers[0].bastidores[2].nickname=Meo-1
rackview.data-centers[0].bastidores[3].nome=B-2A
rackview.data-centers[0].bastidores[4].nome=B-2B
rackview.data-centers[0].bastidores[4].nickname=Bastidor-de-Testes

rackview.data-centers[1].nome=SE06

rackview.data-centers[1].bastidores[0].nome=Bastidor_Central
rackview.data-centers[1].bastidores[1].nome=A1
rackview.data-centers[1].bastidores[2].nome=B1


